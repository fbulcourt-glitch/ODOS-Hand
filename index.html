<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ODOS-Hand - Contrôle</title>
  <style>
    /* Typographie moderne et propre */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    :root {
      --bg-color: #f8f9fa; /* Fond clair */
      --text-color: #333333; /* Texte foncé */
      --card-bg: #ffffff; /* Fond des cartes/onglets blanc */
      --accent-color: #0056b3; /* Bleu assorti à ton outil */
      --border-color: #e0e0e0;
      --success-color: #28a745;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* En-tête : Image et Batterie */
    .header-section {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .device-img {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
      object-fit: contain;
    }

    .battery-info {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    .btn-connect {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-connect:active { background-color: #004494; }
    .btn-connect.connected { background-color: #dc3545; } /* Rouge pour déconnecter */

    /* Système d'onglets */
    .tabs-container {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .tab-buttons {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 15px;
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: #6c757d;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 3px solid var(--accent-color);
    }

    .tab-content {
      display: none;
      padding: 20px;
    }
    .tab-content.active { display: block; }

    /* Onglet Target */
    .target-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .target-input-group label {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="number"] {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1.1rem;
      background: #fdfdfd;
      color: var(--text-color);
    }
    .btn-send {
      background-color: var(--success-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .status-msg {
      font-size: 0.85rem;
      color: var(--success-color);
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* Onglet Records */
    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-sync {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .records-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
    }
    .records-list li {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 1.1rem;
    }
    .records-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- En-tête -->
    <div class="header-section">
      <!-- REMPLACE L'IMAGE ICI -->
      <img src="RenduV28.png" alt="ODOS-Hand" class="device-img" id="deviceImg">
      <div class="battery-info" id="batLevel">Batterie : --%</div>
      <button class="btn-connect" id="btnConnect">Connect / Disconnect</button>
    </div>

    <!-- Onglets -->
    <div class="tabs-container">
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('records')">Records</button>
        <button class="tab-btn" onclick="switchTab('target')">Target</button>
      </div>

      <!-- Contenu Records -->
      <div id="tab-records" class="tab-content active">
        <div class="records-header">
          <h3>Historique</h3>
          <button class="btn-sync" id="btnSync">Sync</button>
        </div>
        <ul class="records-list" id="recordsList">
          <li><span>#1</span><span>-- cm</span></li>
          <li><span>#2</span><span>-- cm</span></li>
          <li style="color:#999; text-align:center; font-size:0.9rem; margin-top:10px;">Connectez l'outil pour synchroniser</li>
        </ul>
      </div>

      <!-- Contenu Target -->
      <div id="tab-target" class="tab-content">
        <div class="target-input-group">
          <label>Distance cible (cm)</label>
          <div class="input-wrapper">
            <input type="number" id="targetInput" placeholder="Ex: 200" step="1" min="1">
            <button class="btn-send" id="btnSend">Send</button>
          </div>
          <div class="status-msg" id="statusMsg">Valeur envoyée ! ✔</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- GESTION DE L'INTERFACE BÁSICO ---
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if(tabName === 'records') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-records').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-target').classList.add('active');
      }
    }

    // Animation temporaire du message de confirmation
    document.getElementById('btnSend').addEventListener('click', () => {
      const msg = document.getElementById('statusMsg');
      msg.style.opacity = 1;
      setTimeout(() => { msg.style.opacity = 0; }, 2000);
      
      // Ici, nous ajouterons plus tard l'appel BLE pour envoyer la valeur.
    });

    // --- (Le code Bluetooth sera injecté ici lors de l'étape suivante) ---
  </script>
</body>
</html>
