<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ODOS-Hand | Odomètre Connecté</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Carte En-tête & Visuel */
    .header-card {
      background: linear-gradient(180deg, #1e293b 0%, #172033 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .device-visual {
      width: 140px;
      height: 140px;
      margin-bottom: 12px;
      filter: drop-shadow(0 6px 12px rgba(59, 130, 246, 0.25));
    }

    .device-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: background-color 0.3s;
    }

    .status-dot.connected {
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .status-dot.connecting {
      background-color: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    /* Jauge Batterie */
    .battery-pill {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .battery-icon {
      width: 20px;
      height: 10px;
      border: 2px solid var(--text-muted);
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 1px;
    }

    .battery-icon::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 4px;
      background-color: var(--text-muted);
      border-radius: 0 2px 2px 0;
    }

    .battery-level {
      height: 100%;
      background-color: var(--accent);
      border-radius: 1px;
      width: 0%;
      transition: width 0.4s ease, background-color 0.4s;
    }

    /* Bouton Principal de Connexion */
    .btn-connect {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .btn-connect:active {
      transform: scale(0.98);
    }

    .btn-connect.connected {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    /* Onglets */
    .tabs-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      padding: 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    /* Contenu des Onglets */
    .tab-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .tab-pane.active {
      display: flex;
    }

    /* Onglet Target */
    .target-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      max-width: 260px;
    }

    .target-input {
      width: 100%;
      background: #0f172a;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 48px 14px 16px;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    .target-input:focus {
      border-color: var(--primary);
    }

    .input-unit {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 1.1rem;
      pointer-events: none;
    }

    .btn-send {
      width: 100%;
      max-width: 260px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #042f2e;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-send:active:not(:disabled) {
      transform: scale(0.98);
    }

    .target-feedback {
      height: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .target-feedback.visible {
      opacity: 1;
    }

    /* Onglet Records */
    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .records-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-sync {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-sync:hover {
      background: #475569;
    }

    .btn-sync:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .records-list {
      list-style: none;
      overflow-y: auto;
      max-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .records-list::-webkit-scrollbar {
      width: 4px;
    }

    .records-list::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .record-item {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .record-index {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .record-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Notification BLE non supporté */
    .compat-warning {
      background: #7f1d1d;
      color: #fecaca;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div id="bleWarning" class="compat-warning">
      ⚠️ Web Bluetooth n'est pas actif. Sur iPhone, utilise le navigateur gratuit <strong>Bluefy</strong>. Sur PC/Android, active le Bluetooth et utilise Chrome.
    </div>

    <!-- En-tête principal -->
    <div class="header-card">
      <!-- Illustration vectorielle de l'ODOS-Hand -->
      <svg class="device-visual" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Corps de l'outil (forme ABS) -->
        <rect x="52" y="24" width="56" height="88" rx="14" fill="#1e293b" stroke="#475569" stroke-width="3" />
        <!-- Écran OLED -->
        <rect x="62" y="34" width="36" height="24" rx="4" fill="#020617" stroke="#3b82f6" stroke-width="1.5" />
        <rect x="66" y="44" width="28" height="4" rx="2" fill="#3b82f6" />
        <!-- Bouton Inox avec Anneau Lumineux -->
        <circle cx="80" cy="84" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2" />
        <circle id="visualLed" cx="80" cy="84" r="10" fill="none" stroke="#3b82f6" stroke-width="2.5" />
        <!-- Roue de mesure (bas) -->
        <circle cx="80" cy="126" r="22" fill="#0f172a" stroke="#64748b" stroke-width="4" stroke-dasharray="6 3" />
        <circle cx="80" cy="126" r="6" fill="#94a3b8" />
      </svg>

      <h1 class="device-title">ODOS-Hand</h1>
      <div class="device-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Déconnecté</span>
      </div>

      <div class="battery-pill">
        <div class="battery-icon">
          <div id="batBar" class="battery-level"></div>
        </div>
        <span id="batText">-- %</span>
      </div>

      <button id="btnConnect" class="btn-connect">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 7 10 10-5 5V2l5 5L7 17"/>
        </svg>
        <span>Connecter ODOS-Hand</span>
      </button>
    </div>

    <!-- Sélecteur d'onglets -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('target')">Target</button>
      <button class="tab-btn" onclick="switchTab('records')">Records</button>
    </div>

    <!-- Conteneur d'onglets -->
    <div class="tab-content">

      <!-- Onglet 1 : Target (Consigne) -->
      <div id="tabTarget" class="tab-pane active">
        <div class="target-box">
          <label style="color: var(--text-muted); font-size: 0.95rem; font-weight: 500;">
            Distance Cible
          </label>
          <div class="input-wrapper">
            <input type="number" id="targetInput" class="target-input" value="200.0" step="0.5" min="0" max="999" />
            <span class="input-unit">cm</span>
          </div>
          <button id="btnSendTarget" class="btn-send" disabled onclick="sendTargetDistance()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            <span>Envoyer la consigne</span>
          </button>
          <div id="targetFeedback" class="target-feedback">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Consigne transmise avec succès !
          </div>
        </div>
      </div>

      <!-- Onglet 2 : Records (Historique) -->
      <div id="tabRecords" class="tab-pane">
        <div class="records-header">
          <span class="records-title">20 dernières mesures</span>
          <button id="btnSync" class="btn-sync" disabled onclick="requestRecordsSync()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            <span>Sync</span>
          </button>
        </div>
        <ul id="recordsList" class="records-list">
          <div class="empty-state">Connectez l'outil et cliquez sur Sync pour charger les mesures.</div>
        </ul>
      </div>

    </div>

  </div>

  <script>
    // --- UUIDs BLUETOOTH BLE DE L'ODOMETRE ODOS-HAND ---
    const SERVICE_UUID   = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHAR_BATTERY   = "19b10001-e8f2-537e-4f6c-d104768a1214"; // Lecture / Notify (%)
    const CHAR_TARGET    = "19b10002-e8f2-537e-4f6c-d104768a1214"; // Lecture / Écriture (float/mm)
    const CHAR_RECORDS   = "19b10003-e8f2-537e-4f6c-d104768a1214"; // Lecture / Notify (Historique)
    const CHAR_COMMAND   = "19b10004-e8f2-537e-4f6c-d104768a1214"; // Écriture (Commandes Deep Sleep, etc.)

    let bleDevice = null;
    let gattServer = null;
    let charBatteryObj = null;
    let charTargetObj = null;
    let charRecordsObj = null;
    let charCommandObj = null;

    // Éléments du DOM
    const btnConnect = document.getElementById("btnConnect");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const batText = document.getElementById("batText");
    const batBar = document.getElementById("batBar");
    const btnSendTarget = document.getElementById("btnSendTarget");
    const targetInput = document.getElementById("targetInput");
    const targetFeedback = document.getElementById("targetFeedback");
    const btnSync = document.getElementById("btnSync");
    const recordsList = document.getElementById("recordsList");
    const visualLed = document.getElementById("visualLed");

    // Vérification de compatibilité Web Bluetooth
    if (!navigator.bluetooth) {
      document.getElementById("bleWarning").style.display = "block";
    }

    // Bascule des onglets
    function switchTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(pane => pane.classList.remove("active"));

      if (tabId === "target") {
        document.querySelector(".tabs-header button:first-child").classList.add("active");
        document.getElementById("tabTarget").classList.add("active");
      } else {
        document.querySelector(".tabs-header button:last-child").classList.add("active");
        document.getElementById("tabRecords").classList.add("active");
      }
    }

    // Mise à jour de l'affichage de la batterie
    function updateBatteryUI(percent) {
      batText.textContent = `${percent} %`;
      batBar.style.width = `${percent}%`;
      if (percent <= 20) {
        batBar.style.backgroundColor = "var(--danger)";
      } else if (percent <= 45) {
        batBar.style.backgroundColor = "#f59e0b";
      } else {
        batBar.style.backgroundColor = "var(--accent)";
      }
    }

    // Gestion de l'état connecté / déconnecté
    function setConnectedState(connected) {
      if (connected) {
        statusDot.className = "status-dot connected";
        statusText.textContent = "Connecté";
        btnConnect.classList.add("connected");
        btnConnect.innerHTML = `<span>Déconnecter (Veille)</span>`;
        btnSendTarget.disabled = false;
        btnSync.disabled = false;
        visualLed.setAttribute("stroke", "#10b981");
      } else {
        statusDot.className = "status-dot";
        statusText.textContent = "Déconnecté";
        btnConnect.classList.remove("connected");
        btnConnect.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 7 10 10-5 5V2l5 5L7 17"/>
          </svg>
          <span>Connecter ODOS-Hand</span>`;
        btnSendTarget.disabled = true;
        btnSync.disabled = true;
        batText.textContent = "-- %";
        batBar.style.width = "0%";
        visualLed.setAttribute("stroke", "#3b82f6");
      }
    }

    // Connexion / Déconnexion principale
    btnConnect.addEventListener("click", async () => {
      if (bleDevice && bleDevice.gatt.connected) {
        // Envoi d'une commande d'extinction propre avant déconnexion
        if (charCommandObj) {
          try {
            await charCommandObj.writeValue(new Uint8Array([0x01])); // 0x01 = Ordre de Deep Sleep
          } catch(e) { console.log(e); }
        }
        bleDevice.gatt.disconnect();
        return;
      }

      try {
        statusDot.className = "status-dot connecting";
        statusText.textContent = "Recherche en cours...";

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "ODOS-Hand" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener("gattserverdisconnected", onDisconnected);

        statusText.textContent = "Connexion...";
        gattServer = await bleDevice.gatt.connect();

        const service = await gattServer.getPrimaryService(SERVICE_UUID);

        charBatteryObj = await service.getCharacteristic(CHAR_BATTERY);
        charTargetObj  = await service.getCharacteristic(CHAR_TARGET);
        charRecordsObj = await service.getCharacteristic(CHAR_RECORDS);
        charCommandObj = await service.getCharacteristic(CHAR_COMMAND);

        // Lecture initiale de la batterie
        const batVal = await charBatteryObj.readValue();
        updateBatteryUI(batVal.getUint8(0));

        // Écoute des mises à jour de batterie
        await charBatteryObj.startNotifications();
        charBatteryObj.addEventListener("characteristicvaluechanged", (event) => {
          updateBatteryUI(event.target.value.getUint8(0));
        });

        // Lecture de la distance cible actuelle
        const targetVal = await charTargetObj.readValue();
        const currentTarget_mm = targetVal.getFloat32(0, true);
        if (!isNaN(currentTarget_mm) && currentTarget_mm > 0) {
          targetInput.value = (currentTarget_mm / 10.0).toFixed(1);
        }

        setConnectedState(true);

      } catch (error) {
        console.error(error);
        setConnectedState(false);
      }
    });

    function onDisconnected() {
      setConnectedState(false);
    }

    // Envoi de la nouvelle distance cible
    async function sendTargetDistance() {
      if (!charTargetObj) return;

      const target_cm = parseFloat(targetInput.value);
      if (isNaN(target_cm) || target_cm <= 0) {
        alert("Veuillez saisir une distance valide supérieure à 0.");
        return;
      }

      const target_mm = target_cm * 10.0;
      const buffer = new ArrayBuffer(4);
      new DataView(buffer).setFloat32(0, target_mm, true);

      try {
        await charTargetObj.writeValue(buffer);

        // Feedback visuel sur le bouton et notification
        targetFeedback.classList.add("visible");
        visualLed.setAttribute("stroke", "#f97316"); // Flash Orange simulé
        setTimeout(() => {
          targetFeedback.classList.remove("visible");
          visualLed.setAttribute("stroke", "#10b981");
        }, 2200);

      } catch (err) {
        alert("Erreur lors de l'envoi de la consigne.");
        console.error(err);
      }
    }

    // Synchronisation de l'historique
    async function requestRecordsSync() {
      if (!charRecordsObj) return;

      btnSync.disabled = true;
      btnSync.innerHTML = "<span>Chargement...</span>";

      try {
        const val = await charRecordsObj.readValue();
        const decoder = new TextDecoder("utf-8");
        const rawString = decoder.decode(val);

        recordsList.innerHTML = "";

        if (!rawString || rawString.trim() === "") {
          recordsList.innerHTML = `<div class="empty-state">Aucune mesure enregistrée.</div>`;
        } else {
          const measures = rawString.split(",").filter(m => m.trim() !== "");
          measures.forEach((item, index) => {
            const li = document.createElement("li");
            li.className = "record-item";
            li.innerHTML = `
              <span class="record-index">#${index + 1}</span>
              <span class="record-value">${parseFloat(item).toFixed(1)} cm</span>
            `;
            recordsList.appendChild(li);
          });
        }
      } catch (err) {
        console.error(err);
        alert("Erreur lors de la synchronisation de l'historique.");
      } finally {
        btnSync.disabled = false;
        btnSync.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          <span>Sync</span>`;
      }
    }
  </script>
</body>
</html>
