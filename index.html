<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <title>ODOS-Hand - Contrôle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    :root {
      --bg-color: #f8f9fa;
      --text-color: #333333;
      --card-bg: #ffffff;
      --accent-color: #0056b3;
      --border-color: #e0e0e0;
      --success-color: #28a745;
      --danger-color: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-section {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .device-img {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
      object-fit: contain;
    }

    .battery-info {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    .btn-connect {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-connect:active { filter: brightness(0.9); }
    .btn-connect.connected { background-color: var(--danger-color); }

    .tabs-container {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .tab-buttons {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 15px;
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: #6c757d;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 3px solid var(--accent-color);
    }

    .tab-content {
      display: none;
      padding: 20px;
    }
    .tab-content.active { display: block; }

    .target-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .target-input-group label {
      font-weight: 600;
      font-size: 0.9rem;
    }
   .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    input[type="number"] {
      flex: 1;
      min-width: 0; /* Clé absolue : permet à la case de s'adapter sans déborder */
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1.1rem;
      background: #fdfdfd;
      color: var(--text-color);
    }
    .btn-send {
      flex-shrink: 0; /* Empêche le bouton d'être écrasé ou tronqué */
      white-space: nowrap;
      background-color: var(--success-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .status-msg {
      font-size: 0.85rem;
      color: var(--success-color);
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-sync {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .records-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
    }
    .records-list li {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 1rem;
    }
    .records-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-section">
      <img src="RenduV28.png" alt="ODOS-Hand" class="device-img" id="deviceImg">
      <div class="battery-info" id="batLevel">Batterie : --%</div>
      <button class="btn-connect" id="btnConnect">Connect</button>
    </div>

    <div class="tabs-container">
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('records')">Records</button>
        <button class="tab-btn" onclick="switchTab('target')">Target</button>
      </div>

      <div id="tab-records" class="tab-content active">
        <div class="records-header">
          <h3>Historique</h3>
          <button class="btn-sync" id="btnSync">Sync</button>
        </div>
        <ul class="records-list" id="recordsList">
          <li style="color:#888; justify-content:center;">Appareil non connecté</li>
        </ul>
      </div>

      <div id="tab-target" class="tab-content">
        <div class="target-input-group">
          <label>Distance cible (cm)</label>
          <div class="input-wrapper">
            <input type="number" id="targetInput" placeholder="Ex: 200" step="0.1" min="1">
            <button class="btn-send" id="btnSend">Send</button>
          </div>
          <div class="status-msg" id="statusMsg">Valeur enregistrée ✔</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // UUIDs identiques à l'ESP32
    const SERVICE_UUID      = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_BATTERY_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    const CHAR_TARGET_UUID  = "d86b86cf-19b4-4b57-b2eb-d1cf822a1012";
    const CHAR_RECORDS_UUID = "9a8ca9ef-e43f-4178-831e-450f3c5520d2";

    let bleDevice = null;
    let bleServer = null;
    let charBattery = null;
    let charTarget = null;
    let charRecords = null;

    const btnConnect = document.getElementById('btnConnect');
    const batLevel = document.getElementById('batLevel');
    const targetInput = document.getElementById('targetInput');
    const btnSend = document.getElementById('btnSend');
    const btnSync = document.getElementById('btnSync');
    const statusMsg = document.getElementById('statusMsg');
    const recordsList = document.getElementById('recordsList');

    // Gestion des onglets
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (tabName === 'records') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-records').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-target').classList.add('active');
      }
    }

    // Connexion / Déconnexion Web Bluetooth
    btnConnect.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth n'est pas pris en charge par ce navigateur. Utilisez Chrome sur Android ou Bluefy sur iPhone.");
        return;
      }

      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }

      try {
        btnConnect.textContent = "Recherche...";
        
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ODOS-Hand' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        btnConnect.textContent = "Connexion...";
        bleServer = await bleDevice.gatt.connect();

        const service = await bleServer.getPrimaryService(SERVICE_UUID);
        charBattery = await service.getCharacteristic(CHAR_BATTERY_UUID);
        charTarget  = await service.getCharacteristic(CHAR_TARGET_UUID);
        charRecords = await service.getCharacteristic(CHAR_RECORDS_UUID);

        // Mise à jour visuelle connexion
        btnConnect.textContent = "Disconnect";
        btnConnect.classList.add('connected');

        // Lecture initiale
        await readBattery();
        await readTarget();
        await readRecords();

      } catch (err) {
        console.error(err);
        resetUI();
      }
    });

    function onDisconnected() {
      resetUI();
    }

    function resetUI() {
      btnConnect.textContent = "Connect";
      btnConnect.classList.remove('connected');
      batLevel.textContent = "Batterie : --%";
      recordsList.innerHTML = '<li style="color:#888; justify-content:center;">Appareil déconnecté</li>';
      bleDevice = null;
      bleServer = null;
      charBattery = null;
      charTarget = null;
      charRecords = null;
    }

    // Lecture du niveau de batterie
    async function readBattery() {
      if (!charBattery) return;
      const val = await charBattery.readValue();
      const pct = val.getUint8(0);
      batLevel.textContent = `Batterie : ${pct}%`;
    }

    // Lecture de la consigne actuelle
    async function readTarget() {
      if (!charTarget) return;
      const val = await charTarget.readValue();
      const str = new TextDecoder().decode(val);
      if (str) targetInput.value = parseFloat(str);
    }

    // Lecture et affichage des 20 mesures
    async function readRecords() {
      if (!charRecords) return;
      const val = await charRecords.readValue();
      const str = new TextDecoder().decode(val);
      recordsList.innerHTML = '';

      if (!str || str.trim() === '') {
        recordsList.innerHTML = '<li style="color:#888; justify-content:center;">Aucune mesure enregistrée</li>';
        return;
      }

      const items = str.split(',');
      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>#${index + 1}</span><span>${parseFloat(item).toFixed(1)} cm</span>`;
        recordsList.appendChild(li);
      });
    }

    btnSync.addEventListener('click', async () => {
      if (!bleServer || !bleServer.connected) {
        alert("Veuillez d'abord connecter l'appareil.");
        return;
      }
      btnSync.textContent = "...";
      await readBattery();
      await readRecords();
      btnSync.textContent = "Sync";
    });

    // Écriture de la nouvelle consigne cible
    btnSend.addEventListener('click', async () => {
      if (!charTarget || !bleServer || !bleServer.connected) {
        alert("Connectez l'outil avant d'envoyer une valeur.");
        return;
      }

      const val = parseFloat(targetInput.value);
      if (isNaN(val) || val <= 0) {
        alert("Veuillez entrer une distance valide en cm.");
        return;
      }

      const data = new TextEncoder().encode(val.toString());
      await charTarget.writeValue(data);

      statusMsg.style.opacity = 1;
      setTimeout(() => { statusMsg.style.opacity = 0; }, 2500);
    });
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
